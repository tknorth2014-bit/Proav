<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" role="img" aria-label="Private jet illustration">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#dfe5ee"/>
      <stop offset="1" stop-color="#9eabbf"/>
    </linearGradient>
    <linearGradient id="engine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6fa"/>
      <stop offset="1" stop-color="#8d9ab0"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="420" cy="222" rx="330" ry="12" fill="url(#shadow)"/>
  <!-- far wing -->
  <path d="M360 146 L 470 146 L 330 120 L 300 120 Z" fill="#b8c3d3"/>
  <!-- tail fin -->
  <path d="M96 128 L 52 26 L 96 26 L 196 110 Z" fill="url(#body)"/>
  <path d="M30 26 L 128 20 L 136 30 L 38 34 Z" fill="#e7ebf2"/>
  <path d="M60 40 L 92 40 L 150 96 L 120 98 Z" fill="#c9a45c" opacity="0.9"/>
  <!-- fuselage -->
  <path d="M70 134 C 70 116, 130 104, 210 102 L 630 98 C 700 98, 760 114, 792 136 C 762 150, 702 156, 630 156 L 210 160 C 130 160, 70 152, 70 134 Z" fill="url(#body)"/>
  <!-- cheat line -->
  <path d="M120 140 L 640 136 C 700 136, 740 140, 770 142" stroke="#c9a45c" stroke-width="3" fill="none"/>
  <path d="M120 147 L 640 143 C 690 143, 730 146, 760 148" stroke="#12213d" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- windows -->
  <g fill="#12213d">
    <rect x="330" y="114" width="16" height="13" rx="6"/>
    <rect x="370" y="113.5" width="16" height="13" rx="6"/>
    <rect x="410" y="113" width="16" height="13" rx="6"/>
    <rect x="450" y="112.5" width="16" height="13" rx="6"/>
    <rect x="490" y="112" width="16" height="13" rx="6"/>
    <rect x="530" y="111.5" width="16" height="13" rx="6"/>
    <rect x="570" y="111" width="16" height="13" rx="6"/>
    <path d="M708 112 L 748 118 L 744 126 L 706 124 Z"/>
  </g>
  <!-- door outline -->
  <rect x="610" y="106" width="30" height="44" rx="5" fill="none" stroke="#9eabbf" stroke-width="1.5"/>
  <!-- engine -->
  <path d="M206 98 L 220 78 L 250 78 L 262 98 Z" fill="#c4cdda"/>
  <rect x="150" y="62" width="150" height="34" rx="17" fill="url(#engine)"/>
  <rect x="286" y="64" width="14" height="30" rx="7" fill="#12213d"/>
  <rect x="150" y="70" width="10" height="18" rx="4" fill="#5b6a82"/>
  <!-- near wing -->
  <path d="M340 148 L 480 148 L 300 196 L 262 196 Z" fill="#eef1f6"/>
  <path d="M262 196 L 300 196 L 300 186 L 266 188 Z" fill="#c9a45c"/>
</svg>
